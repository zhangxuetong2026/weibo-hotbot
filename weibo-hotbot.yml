name: 微博热榜自动推送

on:
  schedule:
    # UTC时间，比北京时间早8小时
    - cron: '0 1 * * *'   # 北京 09:00
    - cron: '0 6 * * *'   # 北京 14:00
    - cron: '0 9 * * *'   # 北京 17:00
    - cron: '0 12 * * *'  # 北京 20:00
  workflow_dispatch:      # 支持手动触发（方便测试）

jobs:
  push-weibo-hot:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 执行热榜推送脚本
        run: python weibo_hotbot.py --sendkey "${{ secrets.SENDKEY }}" --top 50
